[package]
name = "hosting"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
datalium-strata = { workspace = true }
datalium-strata-host = { workspace = true }
datalium-strata-memory = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# test-util: the paused clock (`start_paused`) the drivers' waits run on.
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "test-util"] }
tracing = "0.1"
