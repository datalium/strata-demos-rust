[package]
name = "error-recovery"
version = "0.1.0"
edition = "2024"

[dependencies]
datalium-strata = { workspace = true }
datalium-strata-memory = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `test-util` for `start_paused`: the retries' backoff sleeps run on tokio's
# paused clock, so they take no real time.
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
