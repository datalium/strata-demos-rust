[package]
name = "async-and-cancellation"
version = "0.1.0"
edition = "2024"

[dependencies]
datalium-strata = { workspace = true }
datalium-strata-memory = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `test-util` is for `tokio::time::pause()` / `advance()`: node timeouts and the run's deadline
# run on a paused clock, so the demo never waits on real time.
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "test-util"] }
