# Runs the two demos that call a live OpenAI model (03 and 06).
# Manual only: each run makes real, billed API calls.
name: Live-model demos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check the API key is available
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available to this repository."
            exit 1
          fi

      - name: Build
        run: cargo build --package llm-tool-calling --package token-streaming

      - name: 03 llm-tool-calling
        run: cargo run --package llm-tool-calling

      - name: 06 token-streaming
        run: cargo run --package token-streaming
